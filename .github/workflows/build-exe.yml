# Build DiscordRichPresence.exe อัตโนมัติบน Windows runner
# - ทุกครั้งที่ push tag v* -> สร้าง GitHub Release พร้อมไฟล์ zip ให้ดาวน์โหลด
# - หรือกด "Run workflow" เองในแท็บ Actions -> ได้ artifact
name: build-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Logic tests (no Windows APIs needed)
        run: python tests\test_logic.py
      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name DiscordRichPresence `
            --collect-submodules winrt --collect-binaries winrt --collect-data winrt `
            --hidden-import winrt.windows.media.control `
            --hidden-import winrt.windows.foundation `
            --hidden-import winrt.windows.foundation.collections `
            --hidden-import winrt.windows.storage.streams `
            --hidden-import pystray._win32 `
            main.py
          Copy-Item config.json dist\config.json
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\* -DestinationPath DiscordRichPresence-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordRichPresence-windows
          path: DiscordRichPresence-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DiscordRichPresence-windows.zip
          generate_release_notes: true
